{% extends "base.html" %}

{% block title %}Set New Password — LifeLink Portal{% endblock %}

{% block content %}
<section class="section" style="padding: 4.5rem 0;">
    <div class="container" style="max-width: 480px;">
        <div class="card" style="padding: 2.5rem; box-shadow: var(--shadow-md);">
            <!-- Card Brand Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <span class="nav-brand-icon" style="width: 48px; height: 48px; margin: 0 auto 1rem auto; font-size: 1.25rem; background-color: var(--color-success);">
                    <i data-lucide="shield-check"></i>
                </span>
                <h1 style="font-size: 1.65rem; color: var(--color-secondary); margin-bottom: 0.35rem;">Set New Password</h1>
                <p style="font-size: 0.875rem; color: var(--color-text-subtle);">
                    Choose a strong, secure password for <strong>{{ email }}</strong>.
                </p>
            </div>

            <!-- Password Update Form -->
            <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="newPassword" class="form-label">
                        New Password <span class="required-mark">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        name="password" 
                        class="form-control" 
                        placeholder="At least 8 characters with letters & numbers" 
                        required 
                        minlength="8"
                        autocomplete="new-password"
                    >
                    <span class="form-hint">Must contain at least 8 characters, with letters and numbers.</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        Confirm New Password <span class="required-mark">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirm_password" 
                        class="form-control" 
                        placeholder="Re-enter your new password" 
                        required 
                        minlength="8"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem; margin-bottom: 1.25rem;">
                    <i data-lucide="lock"></i> Update Password & Sign In
                </button>

                <div style="text-align: center; font-size: 0.875rem; color: var(--color-text-subtle); margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--color-border);">
                    Need help? <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--color-primary);">Cancel & Return to Login</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
