{% extends "base.html" %}

{% block title %}404 — Page Not Found | {{ app_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="color: var(--color-primary); margin-bottom: 1rem;">
        <i data-lucide="help-circle" style="width: 64px; height: 64px;"></i>
    </div>
    <h1 style="font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 0.5rem;">404</h1>
    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--color-slate-700);">Page Not Found</h2>
    <p style="color: var(--color-slate-500); margin-bottom: 2rem;">
        The requested page or resource could not be found. Please check the URL or navigate back to the home page.
    </p>
    <div>
        <a href="/" class="btn"><i data-lucide="home"></i> Return Home</a>
    </div>
</div>
{% endblock %}
