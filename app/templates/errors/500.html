{% extends "base.html" %}

{% block title %}500 — Server Error | {{ app_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="color: var(--color-danger); margin-bottom: 1rem;">
        <i data-lucide="alert-octagon" style="width: 64px; height: 64px;"></i>
    </div>
    <h1 style="font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 0.5rem;">500</h1>
    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--color-slate-700);">Internal Server Error</h2>
    <p style="color: var(--color-slate-500); margin-bottom: 2rem;">
        An unexpected error occurred while processing your request. The issue has been logged and is being investigated.
    </p>
    <div>
        <a href="/" class="btn"><i data-lucide="home"></i> Return Home</a>
    </div>
</div>
{% endblock %}
