{% extends "base.html" %}

{% block title %}403 — Access Denied | {{ app_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="color: var(--color-warning); margin-bottom: 1rem;">
        <i data-lucide="shield-alert" style="width: 64px; height: 64px;"></i>
    </div>
    <h1 style="font-family: var(--font-heading); font-size: 2.2rem; margin-bottom: 0.5rem;">403</h1>
    <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: var(--color-slate-700);">Access Denied</h2>
    <p style="color: var(--color-slate-500); margin-bottom: 2rem;">
        You do not have the required permissions to access this portal or resource.
    </p>
    <div>
        <a href="/" class="btn"><i data-lucide="home"></i> Return Home</a>
    </div>
</div>
{% endblock %}
